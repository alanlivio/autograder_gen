[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "autograder-gen"
authors = [{ name = "Alan Guedes", email = "a.guedes@reading.ac.uk" }]
description = "A tool for lecturers to automatically generate assessment scripts for Gradescope"
readme = "README.md"
requires-python = ">=3.8"
keywords = ["autograder", "gradescope"]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "jinja2>=3.0.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "Flask>=3.1.3",
    "Flask-Cors>=5.0.0",
    "gradescope-utils>=0.5.0",
    "bootstrap-flask>=2.0.0",
    "python-docx>=1.1.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://pypi.org/project/autograder-gen/"
Repository = "https://github.com/alanlivio/autograder-gen"

[project.scripts]
autograder_gen = "autograder_gen.cli:main"
autograder_gen_web = "web.app:main"

[tool.setuptools]
packages = ["autograder_gen", "web"]

[tool.setuptools.package-data]
autograder_gen = ["templates/*", "templates/**/*", "examples/*", "examples/**/*"]
web = ["templates/*", "templates/**/*", "static/*", "static/**/*"]

[tool.setuptools.dynamic]
version = { attr = "autograder_gen.version.__version__" }

[tool.black]
extend-exclude = '.*compiler_error.*'
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["output", "build", "dist", ".venv", ".*"]
